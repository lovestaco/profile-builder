<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --border: #272b35;
        --text: #e6e8ec;
        --muted: #9aa0ab;
        --accent: #16a34a;
        --accent-hover: #15803d;
        --danger: #dc2626;
        --danger-hover: #b91c1c;
      }
      * { box-sizing: border-box; }
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      h1 {
        font-size: 15px;
        margin: 0 0 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      h1 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
      label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px; }
      select {
        width: 100%;
        padding: 9px 10px;
        font-size: 14px;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        appearance: none;
        cursor: pointer;
      }
      .capability {
        margin-top: 16px;
        padding: 14px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .capability h2 { font-size: 13px; margin: 0 0 4px; }
      .capability p { font-size: 12px; color: var(--muted); margin: 0 0 12px; line-height: 1.4; }
      .btns { display: flex; gap: 8px; }
      button {
        flex: 1;
        padding: 10px;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.12s, opacity 0.12s;
      }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      .start { background: var(--accent); }
      .start:not(:disabled):hover { background: var(--accent-hover); }
      .stop { background: var(--danger); }
      .stop:not(:disabled):hover { background: var(--danger-hover); }
      .status {
        margin-top: 12px;
        font-size: 12px;
        color: var(--muted);
        min-height: 16px;
        line-height: 1.4;
      }
      .status.running { color: var(--accent); }
      .status.error { color: #f87171; }
      .hint { font-size: 11px; color: var(--muted); margin-top: 10px; line-height: 1.4; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <h1><span class="dot"></span> Profile Builder</h1>

    <label for="platform">Platform</label>
    <select id="platform">
      <option value="">Select a platform…</option>
      <option value="peerlist">Peerlist</option>
      <option value="linkedin" disabled>LinkedIn (coming soon)</option>
    </select>

    <div id="capability" class="capability hidden">
      <h2 id="cap-title"></h2>
      <p id="cap-desc"></p>
      <div class="btns">
        <button id="start" class="start">Start</button>
        <button id="stop" class="stop" disabled>Stop &amp; Export CSV</button>
      </div>
      <div id="status" class="status"></div>
      <div id="hint" class="hint"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
